<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randomness · 免费API测试台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#0f0f1a;color:#e0d8e8;min-height:100vh;padding:24px 16px 48px}
.wrap{width:min(800px,100%);margin:auto}
.time-card{background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:24px;margin-bottom:28px;text-align:center;cursor:pointer;transition:.2s}
.time-card:hover{border-color:rgba(245,158,11,.25)}
.time-card .time{font-size:13px;color:rgba(224,216,232,.48);margin-bottom:10px}
.time-card .msg{font-size:20px;line-height:1.6;font-weight:500}
.time-card .nxyj{margin-top:8px;font-size:15px;color:rgba(224,216,232,.66)}
.header{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;flex-wrap:wrap}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.04em;background:linear-gradient(135deg,#c084fc,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.sub{color:rgba(224,216,232,.48);font-size:14px;margin-bottom:24px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.btn{padding:6px 14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:999px;color:rgba(224,216,232,.7);cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{border-color:rgba(192,132,252,.4);color:#e0d8e8}
.btn.active{background:rgba(192,132,252,.2);border-color:#c084fc;color:#e0d8e8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{border:1px solid rgba(255,255,255,.06);border-radius:18px;overflow:hidden;cursor:pointer;transition:all .2s;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.01))}
.card:hover{border-color:rgba(192,132,252,.35);transform:translateY(-3px);box-shadow:0 8px 24px rgba(192,132,252,.12)}
.card-header{padding:12px 14px 0;display:flex;justify-content:space-between;align-items:center}
.card-header h3{font-size:13px;font-weight:600}
.card-header .tag{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(192,132,252,.18);color:#c084fc}
.card-preview{width:100%;aspect-ratio:1;background:#141420;display:grid;place-items:center;overflow:hidden;position:relative}
.card-preview img{width:100%;height:100%;object-fit:contain;transition:opacity .3s}
.card-preview.static{aspect-ratio:auto;min-height:120px;padding:20px 16px;display:flex;align-items:center;justify-content:center}
.bubble-text{background:linear-gradient(135deg,rgba(192,132,252,.15),rgba(245,158,11,.08));border:1px solid rgba(192,132,252,.2);border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.7;color:rgba(224,216,232,.9);max-width:100%;word-break:break-word}
.card-footer{padding:8px 14px 12px;color:rgba(224,216,232,.28);font-size:10px;word-break:break-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.refresh-btn{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px 12px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);color:rgba(224,216,232,.5);cursor:pointer;font-size:12px;transition:.15s}
.refresh-btn:hover{border-color:rgba(192,132,252,.4);color:#e0d8e8}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="time-card" id="timeCard">
<div class="time" id="timeNow">加载中...</div>
<div class="msg" id="timeMsg">✨</div>
<div class="nxyj" id="timeNxyj"></div>
</div>
<div class="header">
<h1>Randomness</h1>
<button class="refresh-btn" id="refreshAll">⟳ 刷新全部</button>
</div>
<p class="sub">随手测各种免费好玩的 API ╮(¯▽¯)╭</p>
<div class="actions" id="filters"></div>
<div class="grid" id="grid"></div>
</div>
<script>
const CORS = 'https://corsproxy.io/?';
function nocache(url){return url+(url.includes('?')?'&':'?')+'_t='+Date.now()}

const apis=[
{id:'jk',name:'JK制服图',type:'img',url:'https://shanhe.kim/api/tu/jk.php',cat:'图片'},
{id:'anime',name:'二次元动漫',type:'img',url:'https://shanhe.kim/api/tu/anime.php',cat:'图片'},
{id:'mao',name:'猫羽雫',type:'img',url:'https://shanhe.kim/api/tu/mao.php',cat:'图片'},
{id:'heisi',name:'随机黑丝',type:'json-img',url:'https://v2.xxapi.cn/api/heisi',parser:r=>r.data,cors:false,cat:'图片'},
{id:'baisi',name:'随机白丝',type:'json-img',url:'https://v2.xxapi.cn/api/baisi',parser:r=>r.data,cors:false,cat:'图片'},
{id:'setu',name:'随机色图',type:'json-img',url:'https://api.mtyqx.cn/api/random.php?return=json',parser:r=>r.imgurl,cors:true,cat:'图片'},
{id:'tgrj',name:'舔狗日记',type:'text',url:'https://shanhe.kim/api/za/tgrj.php?type=json',parser:r=>r.text,cors:true,cat:'文案'},
{id:'yiyan',name:'BugPk一言',type:'text',url:'https://api.bugpk.com/api/yiyan',parser:r=>{const p=r.split('/&/');return p[1]||p[0]||r},cors:false,cat:'文案'}
];

let active='全部';
const cats=['全部',...new Set(apis.map(a=>a.cat))];
document.getElementById('filters').innerHTML=cats.map(c=>`<button class="btn${active===c?' active':''}" data-cat="${c}">${c}</button>`).join('');
document.getElementById('filters').onclick=e=>{const b=e.target.closest('.btn');if(!b)return;active=b.dataset.cat;document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active',x.dataset.cat===active));render()};

function render(){
const list=active==='全部'?apis:apis.filter(a=>a.cat===active);
document.getElementById('grid').innerHTML=list.map(a=>{
return `<div class="card" data-id="${a.id}"><div class="card-header"><h3>${a.name}</h3><span class="tag">${a.cat}</span></div><div class="card-preview${a.type==='text'?' static':''}" id="pre-${a.id}"><div class="pl" style="color:rgba(224,216,232,.25);font-size:13px;text-align:center;padding:12px">点我加载 ✨</div></div><div class="card-footer">${a.url}</div></div>`
}).join('')}
render();

document.getElementById('grid').onclick=async function(e){
const card=e.target.closest('.card');if(!card)return;
const id=card.dataset.id;const api=apis.find(a=>a.id===id);if(!api)return;
const p=document.getElementById('pre-'+id);
p.innerHTML='<div style="color:rgba(224,216,232,.25);font-size:13px;text-align:center;padding:12px">加载中…</div>';
try{
if(api.type==='img'){
const img=new Image();
img.style.cssText='width:100%;height:100%;object-fit:contain';
img.src=nocache(api.url);
await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej();setTimeout(()=>rej(),12000)});
p.innerHTML='';p.appendChild(img);
}else if(api.type==='json-img'){
const r=await fetch((api.cors?CORS:'')+api.url);
const j=await r.json();
const u=api.parser(j);
if(!u)throw 0;
p.innerHTML=`<img src="${u}" referrerpolicy="no-referrer" style="width:100%;height:100%;object-fit:contain">`;
}else{
const r=await fetch((api.cors?CORS:'')+api.url);
const t=await r.text();
let txt='';
try{const j=JSON.parse(t);txt=api.parser(j)}catch{txt=t};
if(!txt)txt='(空)';
p.innerHTML=`<div class="bubble-text">${txt}</div>`;
}
}catch{e=>{p.innerHTML='<div style="color:rgba(224,216,232,.25);font-size:13px;text-align:center;padding:12px">加载失败 😿</div>'}}
};

document.getElementById('timeCard').onclick=()=>loadTimeYiyan();
async function loadTimeYiyan(){
const n=document.getElementById('timeNow');
const m=document.getElementById('timeMsg');
const x=document.getElementById('timeNxyj');
n.textContent='加载中...';
try{
const r=await fetch(CORS+'https://shanhe.kim/api/za/time.php');
const j=await r.json();
if(j.code==1){
n.textContent='⏰ '+j.nowtime+' · '+j.msg;
m.textContent=j.nxyj;
x.textContent='✨ 点击这里换一句话';}else throw 0;
}catch{
n.textContent='⏰ 加载失败';
m.textContent='生活就像一盒巧克力，你永远不知道下一颗是什么味道';}
}
loadTimeYiyan();

document.getElementById('refreshAll').onclick=async function(){
this.textContent='⟳ 刷新中…';
const list=active==='全部'?apis:apis.filter(a=>a.cat===active);
for(const a of list){
try{const c=document.querySelector('[data-id="'+a.id+'"]');if(c)c.click();await new Promise(r=>setTimeout(r,600))}catch{}}
this.textContent='⟳ 刷新全部';
};
setInterval(loadTimeYiyan,30000);
</script>
</body>
</html>
