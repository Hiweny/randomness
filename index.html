<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=utf-8>

<title>Randomness</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100vh;background:#000;overflow-x:hidden;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#e0d8e8}
#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;width:min(720px,100%);margin:0 auto;padding:48px 20px 80px}
.hero{text-align:center;margin-bottom:10px}
.hero h1{font-size:clamp(36px,8vw,64px);letter-spacing:-.04em;font-weight:700;background:linear-gradient(135deg,#c084fc,#8188f8 40%,#f59e0b 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.yiyan-box{text-align:center;margin-bottom:28px;cursor:pointer;padding:10px 0;transition:opacity .3s}
.yiyan-box:hover{opacity:.8}
.yiyan-box .time{font-size:12px;color:rgba(255,255,255,.35);margin-bottom:4px}
.yiyan-box .msg{font-size:17px;line-height:1.7;color:rgba(255,255,255,.72)}
.yiyan-box .nxyj{margin-top:4px;font-size:13px;color:rgba(255,255,255,.4)}
.tags{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:24px}
.tag{padding:7px 20px;border:1px solid rgba(255,255,255,.1);border-radius:999px;font-size:13px;cursor:pointer;transition:all .25s;background:rgba(255,255,255,.04);color:rgba(255,255,255,.65);user-select:none}
.tag:hover{border-color:rgba(192,132,252,.4);color:#fff}
.tag.active{background:rgba(192,132,252,.2);border-color:rgba(192,132,252,.5);color:#fff}
.cards{display:none;flex-direction:column;gap:10px}
.cards.open{display:flex}
.card{border-radius:16px;overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.card-header .arrow{font-size:10px;transition:transform .3s;opacity:.5}
.card-header .arrow.open{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .4sease}
.card-body.open{max-height:3000px}
.card-image{width:100%;background:rgba(0,0,0,.3)}
.card-image img{width:100%;height:auto;display:block}
.img-actions{display:flex;gap:6px;padding:8px 12px;justify-content:flex-end}
.btn-icon{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:8px;border:none;cursor:pointer;font-size:11px;transition:all .2s;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.btn-icon:hover{background:rgba(255,255,255,.16);color:#fff}
.card-text{padding:10px 14px;background:rgba(0,0,0,.2)}
.bubble-text{border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.7;word-break:break-word}
.text-actions{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.card-svc{padding:6px 16px 10px;font-size:10px;color:rgba(255,255,255,.2);word-break:break-all}
.loader{text-align:center;padding:20px;color:rgba(255,255,255,.35);font-size:13px}
.err{text-align:center;padding:20px;color:rgba(255,255,255,.25);font-size:13px}
