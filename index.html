<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randomness</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#f9f3cc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow-x:hidden}#scene{position:fixed;inset:0;z-index:0;width:100%;height:100%;display:block;background:#000}.wrap{position:relative;z-index:1;min-height:100vh;width:min(760px,100%);margin:auto;padding:24px 18px 80px;display:flex;flex-direction:column;justify-content:center;transition:.35s}.wrap.top{justify-content:flex-start;padding-top:44px}h1{text-align:center;margin:0;font-size:clamp(44px,12vw,76px);line-height:1;letter-spacing:-.06em;background:linear-gradient(135deg,#cfe8fa,#eeb864 55%,#ceacac);-webkit-background-clip:text;color:transparent}.line{margin:18px auto 26px;max-width:620px;text-align:center;font-size:16px;line-height:1.8;color:rgba(249,243,204,.82);min-height:32px;text-shadow:0 2px 18px #000}.tabs{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.tab{border:1px solid rgba(249,243,204,.16);background:rgba(0,24,33,.42);color:rgba(249,243,204,.78);border-radius:999px;padding:9px 24px;font-size:14px;cursor:pointer;backdrop-filter:blur(12px)}.tab.on{background:rgba(238,184,100,.22);border-color:rgba(238,184,100,.55);color:#fff}.list{display:none;margin-top:24px;gap:14px;flex-direction:column}.list.open{display:flex}.card{border-radius:20px;overflow:hidden;background:rgba(0,24,33,.58);border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 60px rgba(0,0,0,.34);backdrop-filter:blur(14px)}.head{padding:15px 17px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:650}.body{display:none}.body.open{display:block}.load,.err{padding:26px;text-align:center;color:rgba(249,243,204,.45)}img{display:block;width:100%;height:auto}.actions{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px}.btn{border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.11);color:#fff;cursor:pointer;text-decoration:none;font-size:13px}.bubble{margin:14px;padding:16px 18px;border-radius:18px;line-height:1.8;font-size:15px;word-break:break-word;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}.api{padding:0 16px 14px;color:rgba(255,255,255,.28);font-size:11px;word-break:break-all}.moon .head{background:linear-gradient(135deg,#1A304C,#5F8DB6);color:#F9F3CC}.dusk .head{background:linear-gradient(135deg,#583437,#B66E58);color:#F9F3CC}.snow .head{background:linear-gradient(135deg,#063139,#396386);color:#B3BCC0}.du .head{background:linear-gradient(135deg,#02232F,#976B3F);color:#EEB864}.cres .head{background:linear-gradient(135deg,#29304E,#75566A);color:#E1C4A5}.lamp .head{background:linear-gradient(135deg,#213240,#DB6B49);color:#fff}.cloud .head{background:linear-gradient(135deg,#28355B,#7C536C);color:#DDD6CB}.star .head{background:linear-gradient(135deg,#000B51,#4387E2);color:#E5BC84}.night .head{background:linear-gradient(135deg,#041724,#785D72);color:#E6C7BD}@media(max-width:520px){.wrap.top{padding-top:28px}.line{font-size:15px}.head{padding:14px 15px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<main class="wrap" id="wrap">
<h1>Randomness</h1>
<div class="line" id="line">正在捞一句夜里的话……</div>
<div class="tabs"><button class="tab" data-type="img">图片</button><button class="tab" data-type="txt">文案</button></div>
<section class="list" id="list"></section>
</main>
<script>
const C='https://corsproxy.io/?';
const apis={img:[
{name:'随机 JK 制服',theme:'moon',kind:'direct',url:'https://shanhe.kim/api/tu/jk.php'},
{name:'随机二次元',theme:'dusk',kind:'direct',url:'https://shanhe.kim/api/tu/anime.php'},
{name:'猫羽雫',theme:'snow',kind:'direct',url:'https://shanhe.kim/api/tu/mao.php'},
{name:'随机黑丝',theme:'du',kind:'jsonimg',url:'https://v2.xxapi.cn/api/heisi'},
{name:'随机白丝',theme:'cres',kind:'jsonimg',url:'https://v2.xxapi.cn/api/baisi'}],txt:[
{name:'舔狗日记',theme:'lamp',kind:'jsontext',url:'https://shanhe.kim/api/za/tgrj.php?type=json',field:'text',proxy:1},
{name:'BugPk 一言',theme:'cloud',kind:'text',url:'https://api.bugpk.com/api/yiyan',proxy:1},
{name:'Hitokoto 一言',theme:'star',kind:'text',url:'https://v1.hitokoto.cn/?encode=text'},
{name:'今日诗词',theme:'night',kind:'poem',url:'https://v2.jinrishici.com/one.json'}]};
const wrap=document.getElementById('wrap'),list=document.getElementById('list'),line=document.getElementById('line');let active='';
async function get(u,p){return fetch((p?C:'')+u+(u.includes('?')?'&':'?')+'_='+Date.now())}
async function timeLine(){try{let j=await (await get('https://shanhe.kim/api/za/time.php',1)).json();line.textContent=j.nxyj||j.msg||'今晚的月光没有迟到。'}catch(e){line.textContent='今晚的月光没有迟到。'}}timeLine();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{let t=b.dataset.type;if(active===t){active='';list.className='list';list.innerHTML='';wrap.classList.remove('top');b.classList.remove('on');return}active=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));wrap.classList.add('top');render(t)});
function render(t){list.className='list open';list.innerHTML=apis[t].map((a,i)=>`<article class="card ${a.theme}"><div class="head" onclick="openCard(${i})"><span>${a.name}</span><span>⌄</span></div><div class="body" id="b${i}"></div></article>`).join('')}
async function openCard(i){let a=apis[active][i],b=document.getElementById('b'+i);if(b.classList.contains('open')){b.classList.remove('open');return}b.classList.add('open');b.innerHTML='<div class="load">重新获取中……</div>';try{if(active==='img'){let src=a.url;if(a.kind==='jsonimg'){let j=await (await get(a.url)).json();src=j.data||j.imgurl||j.url}src+=(src.includes('?')?'&':'?')+'t='+Date.now();b.innerHTML=`<img src="${src}" onerror="this.parentNode.innerHTML='<div class=err>图片加载失败，点开接口试试</div>'"><div class="actions"><button class="btn" onclick="event.stopPropagation();open('${src}')">打开</button><a class="btn" href="${src}" download target="_blank" onclick="event.stopPropagation()">下载</a></div><div class="api">${a.url}</div>`}else{let text='';if(a.kind==='jsontext'){let j=await (await get(a.url,a.proxy)).json();text=j[a.field]||j.text||j.msg||JSON.stringify(j)}else if(a.kind==='poem'){let j=await (await get(a.url)).json();let d=j.data||{};text=(d.content||'')+(d.origin&&d.origin.title?'\n——《'+d.origin.title+'》':'')}else{text=await (await get(a.url,a.proxy)).text();text=text.replace('/&/','\n')}b.innerHTML=`<div class="bubble">${esc(text)}</div><div class="actions"><button class="btn" onclick="event.stopPropagation();copyText(${JSON.stringify(text)})">复制</button></div><div class="api">${a.url}</div>`}}catch(e){b.innerHTML='<div class="err">这个接口这次没接住，刷新再试。</div>'}}
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function copyText(t){navigator.clipboard&&navigator.clipboard.writeText(t)}
(()=>{const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W,H,dpr,time=0,particles=[];const PARTICLE_COUNT=800,SPEED=2.5,COLORS=[{r:80,g:230,b:255},{r:200,g:100,b:255},{r:255,g:80,b:180},{r:120,g:220,b:255},{r:255,g:255,b:255},{r:255,g:150,b:255}];function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}function rc(){return COLORS[Math.floor(Math.random()*COLORS.length)]}function make(){let t=Math.random(),shape=t<.3?'filled-star':t<.5?'outline-star':t<.65?'dot':t<.78?'cross':t<.88?'glow':'sparkle',z=Math.random()*2000+500;return{x:(Math.random()-.5)*W*3,y:(Math.random()-.5)*H*3,z,baseZ:z,size:2+Math.random()*12,color:rc(),shape,phase:Math.random()*Math.PI*2,twinkleSpeed:.5+Math.random()*2,rotation:Math.random()*Math.PI*2,rotSpeed:(Math.random()-.5)*.02}}function init(){particles=[];for(let i=0;i<PARTICLE_COUNT;i++){let p=make();p.z=Math.random()*2500;particles.push(p)}}function star(x,y,s,c,a,r,fill){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.beginPath();for(let i=0;i<10;i++){let rr=i%2? s*.4:s,ang=i*Math.PI/5-Math.PI/2;i?ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr):ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr)}ctx.closePath();ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},${a*.8})`;ctx.shadowBlur=s*1.5;if(fill){ctx.fillStyle=`rgba(${c.r},${c.g},${c.b},${a})`;ctx.fill()}else{ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${a})`;ctx.lineWidth=Math.max(.5,s*.12);ctx.stroke()}ctx.shadowBlur=0;ctx.restore()}function cross(x,y,s,c,a){ctx.save();ctx.translate(x,y);ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${a})`;ctx.lineWidth=Math.max(.5,s*.15);ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},${a*.7})`;ctx.shadowBlur=s*.8;let r=s*.7;ctx.beginPath();ctx.moveTo(0,-r);ctx.lineTo(0,r);ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();ctx.restore()}function glow(x,y,s,c,a){let g=ctx.createRadialGradient(x,y,0,x,y,s*3);g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${a*.6})`);g.addColorStop(.5,`rgba(${c.r},${c.g},${c.b},${a*.2})`);g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s*3,0,7);ctx.fill()}function dot(x,y,s,c,a){ctx.beginPath();ctx.arc(x,y,Math.max(.5,s*.35),0,7);ctx.fillStyle=`rgba(${c.r},${c.g},${c.b},${a})`;ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},${a*.8})`;ctx.shadowBlur=s*1.2;ctx.fill();ctx.shadowBlur=0}function spark(x,y,s,c,a,r){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.strokeStyle=`rgba(${c.r},${c.g},${c.b},${a})`;ctx.lineWidth=Math.max(.5,s*.1);ctx.shadowColor=`rgba(${c.r},${c.g},${c.b},${a*.7})`;ctx.shadowBlur=s;let q=s*.8;ctx.beginPath();ctx.moveTo(0,-q);ctx.lineTo(0,q);ctx.moveTo(-q*.5,-q*.3);ctx.lineTo(q*.5,q*.3);ctx.moveTo(-q*.5,q*.3);ctx.lineTo(q*.5,-q*.3);ctx.stroke();ctx.restore()}function animate(){time+=.016;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);let cx=W/2,cy=H/2,fl=400;particles.sort((a,b)=>b.z-a.z);for(const p of particles){p.z-=SPEED*(1+(2500-p.z)/2500);p.rotation+=p.rotSpeed;if(p.z<=10){Object.assign(p,make());p.z=2500;continue}let sc=fl/p.z,x=cx+p.x*sc,y=cy+p.y*sc,s=p.size*sc;if(x<-50||x>W+50||y<-50||y>H+50)continue;let a=1;if(p.z>2000)a=(2500-p.z)/500;if(p.z<200)a=p.z/200;a=Math.max(0,Math.min(1,a))*(.7+.3*Math.sin(time*p.twinkleSpeed+p.phase));if(s<.3){dot(x,y,s,p.color,a*.6);continue}if(p.shape==='filled-star')star(x,y,s,p.color,a,p.rotation,1);else if(p.shape==='outline-star')star(x,y,s,p.color,a,p.rotation,0);else if(p.shape==='cross')cross(x,y,s,p.color,a);else if(p.shape==='glow')glow(x,y,s,p.color,a);else if(p.shape==='sparkle')spark(x,y,s,p.color,a,p.rotation);else dot(x,y,s,p.color,a)}requestAnimationFrame(animate)}addEventListener('resize',resize);resize();init();animate()})();
</script>
</body>
</html>
