<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Randomness · 免费API测试台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#e0d8e8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
.wrap{width:min(800px,100%);margin:auto}
h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.04em;margin-bottom:8px;background:linear-gradient(135deg,#c084fc,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:rgba(224,216,232,.56);margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{border:1px solid rgba(255,255,255,.08);background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border-radius:20px;padding:18px;transition:all .2s ease;cursor:pointer}
.card:hover{border-color:rgba(192,132,252,.4);background:rgba(192,132,252,.08);transform:translateY(-2px)}
.card h3{font-size:14px;color:rgba(224,216,232,.68);margin-bottom:6px}
.card .type{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(192,132,252,.2);color:#c084fc;margin-bottom:10px}
.card .preview{width:100%;aspect-ratio:16/9;border-radius:12px;background:#1a1a2e;overflow:hidden;display:grid;place-items:center}
.card .preview img,.card .preview video{width:100%;height:100%;object-fit:cover}
.card .preview .text{color:rgba(224,216,232,.4);font-size:13px;padding:12px;text-align:center}
.card .url{display:block;font-size:11px;color:rgba(224,216,232,.32);margin-top:8px;word-break:break-all}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.btn{padding:8px 16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);border-radius:999px;color:#e0d8e8;cursor:pointer;font-size:14px;transition:.15s}
.btn:hover{border-color:#c084fc;background:rgba(192,132,252,.2)}
.btn.active{background:rgba(192,132,252,.25);border-color:#c084fc}
.loading{text-align:center;color:rgba(224,216,232,.4);padding:32px}
</style>
</head>
<body>
<div class="wrap">
<h1>Randomness</h1>
<p class="sub">随手测试各种免费好玩的 API ╮(¯▽¯)╭</p>
<div class="actions" id="filters"></div>
<div class="grid" id="grid"></div>
</div>
<script>
const apis=[
{id:'jk',name:'JK制服图',type:'image',url:'http://shanhe.kim/api/tu/jk.php?type=json',parser:r=>r.image,cat:'图片'},
{id:'anime',name:'二次元动漫',type:'image',url:'http://shanhe.kim/api/tu/anime.php?type=json',parser:r=>r.image,cat:'图片'},
{id:'mao',name:'猫羽雫图片',type:'image',url:'http://shanhe.kim/api/tu/mao.php?type=json',parser:r=>r.image,cat:'图片'},
{id:'heisi',name:'随机黑丝',type:'image',url:'https://v2.xxapi.cn/api/heisi',parser:r=>r.data,cat:'图片'},
{id:'baisi',name:'随机白丝',type:'image',url:'https://v2.xxapi.cn/api/baisi',parser:r=>r.data,cat:'图片'},
{id:'yiyan',name:'BugPk一言',type:'text',url:'https://api.bugpk.com/api/yiyan',parser:r=>r,cat:'文字'}
];
let active='all';
const cats=['全部',...new Set(apis.map(a=>a.cat))];
document.getElementById('filters').innerHTML=cats.map(c=>`<button class="btn${active===c?' active':''}" data-cat="${c}">${c}</button>`).join('');
document.getElementById('filters').onclick=e=>{const b=e.target.closest('.btn');if(!b)return;active=b.dataset.cat;document.querySelectorAll('.btn').forEach(x=>x.classList.toggle('active',x.dataset.cat===active));render()};
function render(){
const list=active==='全部'?apis:apis.filter(a=>a.cat===active);
document.getElementById('grid').innerHTML=list.map(a=>`<div class="card" data-id="${a.id}"><h3>${a.name}</h3><span class="type">${a.cat}</span><div class="preview" id="preview-${a.id}"><div class="text">点击加载</div></div><span class="url">${a.url}</span></div>`).join('')}
render();
document.getElementById('grid').onclick=async function(e){
const card=e.target.closest('.card');if(!card)return;
const id=card.dataset.id;const api=apis.find(a=>a.id===id);if(!api)return;
const preview=document.getElementById('preview-'+id);
preview.innerHTML='<div class="text">加载中…</div>';
try{
const r=await fetch(api.url);
if(api.type==='image'){
const j=await r.json();
const imgUrl=api.parser(j);
preview.innerHTML=`<img src="${imgUrl}" referrerpolicy="no-referrer">`;
}else{
const t=await r.text();
const parts=t.split('/&/');
preview.innerHTML=`<div class="text">${parts[1]||parts[0]||t}</div>`;
}
}catch(e){preview.innerHTML=`<div class="text">加载失败 😿</div>`}
};
</script>
</body>
</html>
